[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by alembic script / CLI --url)
sqlalchemy.url = postgresql+psycopg2://soc:socpassword@localhost:5432/socdb

# version location
version_locations = alembic/versions

# logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S